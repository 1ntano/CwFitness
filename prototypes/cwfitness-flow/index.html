<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>CwFitness · 交互原型</title>
  <style>
    :root {
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
      --text: rgba(255,255,255,.96);
      --muted: rgba(255,255,255,.62);
      --faint: rgba(255,255,255,.38);
      --line: rgba(255,255,255,.12);
      --surface: rgba(18,20,22,.66);
      --surface-heavy: rgba(12,14,16,.86);
      --accent: #b7d87d;
      --danger: #e59387;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      color: var(--text);
      background: #090b0c;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #090b0c; }
    body { overflow-x: hidden; }
    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, [tabindex]:focus-visible { outline: 2px solid rgba(255,255,255,.78); outline-offset: 3px; }
    #stage { min-height: 100vh; }

    .app {
      --hero-image: url("https://images.unsplash.com/photo-1605296867724-fa87a8ef53fd?auto=format&fit=crop&w=2200&q=82");
      min-height: 100vh;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background: #0a0c0d;
    }
    .app::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      background-image: linear-gradient(90deg, rgba(6,8,9,.95) 0%, rgba(6,8,9,.55) 42%, rgba(6,8,9,.25) 100%), var(--hero-image);
      background-size: cover;
      background-position: center;
      filter: saturate(.54) brightness(.7);
      transform: scale(1.02);
    }
    .app::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background: linear-gradient(180deg, rgba(4,6,7,.08), rgba(4,6,7,.32) 56%, #090b0c 100%);
      pointer-events: none;
    }

    .glass {
      background: var(--surface);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      backdrop-filter: blur(24px) saturate(1.2);
      box-shadow: inset 0 1px rgba(255,255,255,.13), 0 18px 48px rgba(0,0,0,.28);
    }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 12px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 14px; font-size: clamp(42px, 6vw, 82px); line-height: .98; letter-spacing: -.052em; }
    h2 { letter-spacing: -.035em; }
    .lede { max-width: 610px; color: rgba(255,255,255,.72); font-size: clamp(16px, 1.7vw, 20px); line-height: 1.5; }
    .meta { color: var(--muted); font-size: 13px; }
    .value { font-variant-numeric: tabular-nums; letter-spacing: -.03em; }

    .btn, .icon-btn, .nav-btn, .plan-card, .set-row, .rail-card {
      border: 0;
      cursor: pointer;
      transition: transform 140ms var(--ease-out), color 160ms ease, background-color 160ms ease, opacity 160ms ease;
    }
    .btn:active, .icon-btn:active, .nav-btn:active, .plan-card:active, .set-row:active, .rail-card:active { transform: scale(.97); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 46px; padding: 0 19px; border-radius: 999px; font-weight: 720; }
    .btn-primary { color: #10140d; background: var(--accent); box-shadow: 0 10px 30px color-mix(in srgb, var(--accent) 22%, transparent); }
    .btn-secondary { color: var(--text); background: rgba(255,255,255,.10); box-shadow: inset 0 0 0 1px rgba(255,255,255,.11); }
    .btn-danger { color: #1b0d0a; background: var(--danger); }
    .btn:disabled { opacity: .38; cursor: not-allowed; transform: none; }
    .icon-btn { display: grid; place-items: center; width: 42px; height: 42px; padding: 0; border-radius: 50%; background: rgba(255,255,255,.09); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    .topbar { position: relative; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 24px clamp(22px, 4vw, 60px); }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; letter-spacing: -.02em; }
    .brand-mark { width: 28px; height: 28px; border-radius: 9px; background: radial-gradient(circle at 30% 25%, #eefacb, var(--accent) 48%, #4d6431); box-shadow: 0 7px 24px rgba(170,210,110,.25); }
    .avatar { display: grid; place-items: center; width: 38px; height: 38px; border: 0; border-radius: 50%; background: linear-gradient(145deg,#cbd2c0,#576456); color: #111; font-weight: 850; cursor: pointer; }

    .view { display: none; }
    .view[data-visible] { display: block; animation: view-in 240ms var(--ease-out) both; }
    @keyframes view-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .cinematic { --accent: #c2db86; }
    .cinematic .cinematic-nav { position: fixed; z-index: 10; top: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; width: auto; padding: 4px; border-radius: 999px; background: rgba(10,10,10,.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12); }
    .cinematic .nav-btn { width: auto; height: 28px; display: flex; align-items: center; gap: 7px; padding: 0 13px; border-radius: 999px; color: rgba(255,255,255,.55); background: transparent; text-align: center; font-size: 13px; }
    .cinematic .nav-btn[data-active] { color: #fff; background: rgba(255,255,255,.12); font-weight: 700; }
    .cinematic-main { max-width: 1210px; margin: 0 auto; padding: min(12vh,120px) clamp(28px,6vw,94px) 120px; }
    .cinematic-hero { min-height: 47vh; display: flex; flex-direction: column; justify-content: flex-end; max-width: 820px; }
    .stats-strip { display: grid; grid-template-columns: repeat(3,minmax(120px,1fr)); gap: 10px; max-width: 640px; margin-top: 30px; }
    .stat { padding: 18px; border-radius: 22px; background: rgba(15,17,18,.46); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
    .stat strong { display: block; font-size: 24px; margin-bottom: 5px; }
    .section-title { display: flex; align-items: end; justify-content: space-between; margin: 44px 0 16px; }
    .section-title h2 { margin: 0; font-size: 23px; }
    .card-rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 31vw); gap: 14px; overflow-x: auto; padding: 3px 3px 18px; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .card-rail::-webkit-scrollbar { display: none; }
    .plan-card { min-height: 180px; padding: 22px; border-radius: 26px; color: var(--text); text-align: left; scroll-snap-align: start; background: linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.05)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 18px 45px rgba(0,0,0,.22); }
    .plan-card .card-top { display: flex; justify-content: space-between; }
    .plan-card h3 { margin: 44px 0 7px; font-size: 24px; }

    .console { --accent: #95cfc4; --hero-image: url("https://images.unsplash.com/photo-1709315948410-69a2a7db80d6?auto=format&fit=crop&w=2200&q=82"); }
    .console::before { background-image: linear-gradient(90deg, rgba(6,9,10,.96) 0%, rgba(6,9,10,.82) 34%, rgba(6,9,10,.28) 100%), var(--hero-image); }
    .console-shell { display: grid; grid-template-columns: 260px minmax(0,1fr); gap: 18px; min-height: calc(100vh - 92px); padding: 0 24px 110px; }
    .console-side { padding: 24px 14px; border-radius: 30px; align-self: stretch; }
    .console-side .nav-btn { width: 100%; display: flex; gap: 12px; padding: 13px 15px; margin-bottom: 4px; border-radius: 16px; background: transparent; color: var(--muted); text-align: left; }
    .console-side .nav-btn[data-active] { color: var(--text); background: rgba(255,255,255,.12); }
    .console-profile { display: flex; align-items: center; gap: 11px; padding: 10px 10px 25px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
    .console-main { min-width: 0; }
    .console-hero { min-height: 47vh; display: grid; align-content: end; padding: clamp(32px,5vw,68px); border-radius: 34px; overflow: hidden; background: linear-gradient(115deg,rgba(5,8,9,.86),rgba(5,8,9,.12)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
    .console-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 14px; margin-top: 14px; }
    .console-card { min-height: 176px; padding: 22px; border-radius: 26px; background: rgba(12,16,17,.72); box-shadow: inset 0 0 0 1px rgba(255,255,255,.09); }
    .bars { height: 86px; display: flex; align-items: end; gap: 7px; margin-top: 20px; }
    .bars i { flex: 1; min-width: 7px; height: var(--h); border-radius: 5px 5px 2px 2px; background: color-mix(in srgb,var(--accent) 75%,transparent); }

    .focus { --accent: #d9b987; --hero-image: url("https://images.unsplash.com/photo-1700784795176-7ff886439d79?auto=format&fit=crop&w=2200&q=82"); }
    .focus::before { background-image: linear-gradient(180deg,rgba(7,8,9,.15),rgba(7,8,9,.52) 58%,#090b0c 100%), var(--hero-image); }
    .focus .topbar { padding-inline: clamp(22px,5vw,74px); }
    .focus-nav { display: flex; gap: 3px; padding: 4px; border-radius: 999px; background: rgba(10,10,10,.48); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
    .focus-nav .nav-btn { padding: 9px 17px; border-radius: 999px; color: var(--muted); background: transparent; }
    .focus-nav .nav-btn[data-active] { color: #111; background: rgba(255,255,255,.9); }
    .focus-main { padding: min(14vh,135px) clamp(24px,6vw,92px) 120px; }
    .focus-copy { max-width: 760px; }
    .focus-copy h1 { font-size: clamp(50px,8vw,106px); }
    .focus-rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 39vw); gap: 16px; margin-top: 58px; overflow-x: auto; padding: 8px 3px 20px; scrollbar-width: none; scroll-snap-type: x mandatory; }
    .rail-card { min-height: 225px; padding: 24px; border-radius: 30px; text-align: left; color: var(--text); scroll-snap-align: start; background: rgba(16,17,18,.62); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.11), 0 20px 60px rgba(0,0,0,.25); }
    .rail-card[data-featured] { background: linear-gradient(145deg,color-mix(in srgb,var(--accent) 30%,rgba(16,17,18,.68)),rgba(16,17,18,.72)); }
    .rail-card h3 { margin: 72px 0 8px; font-size: 28px; }

    .content-page { max-width: 1120px; margin: 0 auto; padding: 50px clamp(24px,6vw,80px) 130px; }
    .content-page > h1 { font-size: clamp(42px,6vw,72px); }
    .grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; }
    .tile { min-height: 190px; padding: 22px; border-radius: 26px; background: rgba(16,18,19,.75); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: inset 0 0 0 1px var(--line); }
    .tile h3 { margin-bottom: 8px; }
    .metric { margin: 20px 0 5px; font-size: 42px; font-weight: 780; letter-spacing: -.05em; }
    .line-chart { width: 100%; height: 120px; margin-top: 18px; overflow: visible; }
    .line-chart polyline { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .line-chart .fill { fill: url(#chartFill); stroke: none; }

    .workout-layer, .result-layer, .settings-layer {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(4,6,7,.66);
      -webkit-backdrop-filter: blur(20px) saturate(.8);
      backdrop-filter: blur(20px) saturate(.8);
      animation: layer-in 240ms var(--ease-out) both;
    }
    @keyframes layer-in { from { opacity: 0; } to { opacity: 1; } }
    .workout-panel, .result-panel, .settings-panel {
      width: min(860px,100%);
      max-height: min(820px,calc(100vh - 44px));
      overflow: auto;
      padding: clamp(22px,4vw,42px);
      border-radius: 34px;
      background: rgba(13,15,16,.94);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12),0 34px 100px rgba(0,0,0,.55);
      animation: panel-in 260ms var(--ease-out) both;
    }
    @keyframes panel-in { from { opacity: 0; transform: scale(.96) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .workout-head { display: flex; justify-content: space-between; gap: 18px; align-items: start; }
    .timer { font-size: 28px; font-weight: 760; font-variant-numeric: tabular-nums; }
    .exercise { margin-top: 26px; padding-top: 24px; border-top: 1px solid var(--line); }
    .exercise-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .exercise-head h3 { margin: 0; font-size: 23px; }
    .set-list { display: grid; gap: 8px; margin-top: 16px; }
    .set-row { display: grid; grid-template-columns: 48px 1fr 1fr 70px 36px; gap: 10px; align-items: center; width: 100%; padding: 13px 15px; border-radius: 17px; color: var(--text); text-align: left; background: rgba(255,255,255,.055); box-shadow: inset 0 0 0 1px rgba(255,255,255,.075); }
    .set-row .check { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.08); }
    .set-row[data-done] { background: color-mix(in srgb,var(--accent) 14%,rgba(255,255,255,.045)); }
    .set-row[data-done] .check { color: #111; background: var(--accent); }
    .set-row[data-done] .check::after { content: "✓"; font-weight: 900; }
    .set-row[data-done] .check span { display: none; }
    .workout-footer { position: sticky; bottom: -42px; display: flex; justify-content: space-between; gap: 10px; margin: 28px -42px -42px; padding: 18px 42px 42px; background: linear-gradient(180deg,transparent,rgba(13,15,16,.98) 30%); }
    .paused-banner { display: none; margin-top: 18px; padding: 14px 16px; border-radius: 16px; color: #18140c; background: var(--accent); font-weight: 760; }
    .workout-panel[data-paused] .paused-banner { display: block; }
    .workout-panel[data-paused] .set-row { opacity: .42; pointer-events: none; }
    .result-ring { width: 160px; height: 160px; margin: 12px auto 28px; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(var(--accent) 0 94%,rgba(255,255,255,.09) 94%); box-shadow: inset 0 0 0 18px rgba(10,12,12,.94),0 18px 50px rgba(0,0,0,.3); font-size: 38px; font-weight: 820; }
    .result-panel { text-align: center; }
    .result-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin: 24px 0; text-align: left; }
    .result-grid .stat { background: rgba(255,255,255,.055); }
    .settings-panel { width: min(520px,100%); }
    .settings-row { display: flex; justify-content: space-between; gap: 18px; align-items: center; padding: 17px 0; border-bottom: 1px solid var(--line); }
    .toast { position: fixed; z-index: 80; top: 24px; left: 50%; transform: translateX(-50%); padding: 13px 17px; border-radius: 999px; background: rgba(18,20,21,.92); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); box-shadow: inset 0 0 0 1px var(--line),0 14px 36px rgba(0,0,0,.3); animation: toast-in 400ms ease both; }
    @keyframes toast-in { from { opacity: 0; transform: translate(-50%,-100%); } to { opacity: 1; transform: translate(-50%,0); } }

    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }

    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }

    .proto-picker-item {
      position: relative;
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }

    .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
    .proto-picker-item:active { transform: scale(0.97); }
    .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
    .proto-picker-item[data-active] { color: #fff; }
    .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
    .proto-picker-replay { padding: 0 10px; font-size: 14px; }
    .proto-picker[data-position="top"] { bottom: auto; top: 24px; }

    @media (hover: hover) and (pointer: fine) {
      .plan-card:hover, .rail-card:hover { transform: scale(1.018) translateY(-3px); background-color: rgba(255,255,255,.13); }
      .btn:hover { filter: brightness(1.06); }
      .set-row:hover { background-color: rgba(255,255,255,.09); }
    }
    @media (max-width: 860px) {
      .cinematic .cinematic-nav { top: 18px; right: auto; bottom: auto; left: 50%; width: auto; transform: translateX(-50%); display: flex; border-radius: 999px; }
      .cinematic .cinematic-nav .nav-btn { justify-content: center; padding: 0 10px; }
      .cinematic .cinematic-nav .nav-btn span:first-child { display: none; }
      .cinematic-main { padding: 70px 22px 150px; }
      .cinematic-hero { min-height: 50vh; }
      .console-shell { display: block; padding: 0 16px 150px; }
      .console-side { position: fixed; z-index: 10; right: 18px; bottom: 76px; left: 18px; display: flex; padding: 5px; border-radius: 999px; }
      .console-side .console-profile { display: none; }
      .console-side .nav-btn { justify-content: center; margin: 0; padding: 11px 7px; }
      .console-hero { min-height: 57vh; padding: 26px; }
      .console-grid { grid-template-columns: 1fr; }
      .focus-nav { position: fixed; z-index: 10; right: 18px; bottom: 76px; left: 18px; justify-content: center; }
      .focus-main { padding: 80px 22px 150px; }
      .focus-rail, .card-rail { grid-auto-columns: 82vw; }
      .grid { grid-template-columns: 1fr; }
      .stats-strip { grid-template-columns: repeat(3,1fr); }
      .stat { padding: 14px; }
      .set-row { grid-template-columns: 42px 1fr 1fr 36px; }
      .set-row .set-rate { display: none; }
      .workout-footer { margin-inline: -22px; padding-inline: 22px; }
      .result-grid { grid-template-columns: 1fr; }
      .proto-picker { bottom: 16px; max-width: calc(100vw - 20px); overflow-x: auto; }
      .proto-picker-item { padding-inline: 9px; white-space: nowrap; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .app::before, .plan-card:hover, .rail-card:hover { transform: none !important; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .glass, .console-card, .tile, .rail-card, .workout-panel, .result-panel, .settings-panel { background: #151819 !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    }
    @media (prefers-contrast: more) {
      :root { --muted: rgba(255,255,255,.82); --line: rgba(255,255,255,.34); }
      .glass, .console-card, .tile, .rail-card { box-shadow: inset 0 0 0 2px var(--line); }
    }
  </style>
</head>
<body>
  <main id="stage"></main>


  <template id="variant-cinematic">
    <div class="app cinematic" data-app>
      <header class="topbar"><div class="brand"><span class="brand-mark"></span>CwFitness</div><button class="avatar" data-settings aria-label="打开设置">林</button></header>
      <nav class="cinematic-nav glass" aria-label="主导航">
        <button class="nav-btn" data-nav="home" data-active><span>⌂</span><span>Home</span></button>
        <button class="nav-btn" data-nav="plans"><span>▤</span><span>Plans</span></button>
        <button class="nav-btn" data-nav="progress"><span>↗</span><span>Progress</span></button>
      </nav>
      <section class="view" data-view="home" data-visible>
        <div class="cinematic-main">
          <div class="cinematic-hero">
            <p class="eyebrow">今天 · Push Day</p>
            <h1>把今天<br>练扎实。</h1>
            <p class="lede">胸、肩、三头 · 5 个动作 · 预计 52 分钟。目标已经准备好，你只需开始。</p>
            <div class="actions"><button class="btn btn-primary" data-start>开始训练&nbsp; →</button><button class="btn btn-secondary" data-nav="plans">查看计划</button></div>
            <div class="stats-strip"><div class="stat"><strong class="value">186</strong><span class="meta">本周分钟</span></div><div class="stat"><strong class="value">4</strong><span class="meta">连续训练周</span></div><div class="stat"><strong class="value">94%</strong><span class="meta">卧推 · 最近</span></div></div>
          </div>
          <div class="section-title"><h2>你的训练计划</h2><span class="meta">按 → 浏览</span></div>
          <div class="card-rail">
            <button class="plan-card" data-start><div class="card-top"><span class="eyebrow">今天</span><span>52 分钟</span></div><h3>Push Day</h3><span class="meta">卧推 · 上斜推 · 肩推 · 侧平举</span></button>
            <button class="plan-card" data-toast="Pull Day 建议周三训练"><div class="card-top"><span class="eyebrow">周三</span><span>48 分钟</span></div><h3>Pull Day</h3><span class="meta">硬拉 · 划船 · 下拉 · 弯举</span></button>
            <button class="plan-card" data-toast="Leg Day 建议周五训练"><div class="card-top"><span class="eyebrow">周五</span><span>58 分钟</span></div><h3>Leg Day</h3><span class="meta">深蹲 · 腿举 · 腿弯举 · 提踵</span></button>
          </div>
        </div>
      </section>
      <section class="view content-page" data-view="plans"></section>
      <section class="view content-page" data-view="progress"></section>
    </div>
  </template>



  <script>
    const stage = document.getElementById('stage');
    let elapsed = 0;
    let timerId = null;
    let paused = false;

    function mount() {
      clearInterval(timerId);
      stage.innerHTML = '';
      requestAnimationFrame(() => {
        stage.append(document.getElementById('variant-cinematic').content.cloneNode(true));
        hydrateViews();
      });
    }

    function plansMarkup() {
      return `<p class="eyebrow">训练结构</p><h1>Plans</h1><p class="lede">计划决定目标，训练只记录实际表现。</p><div class="grid"><article class="tile"><span class="eyebrow">主计划</span><h2>力量基础</h2><p class="meta">Push · Pull · Legs</p><button class="btn btn-primary" data-toast="已打开计划编辑器">编辑计划</button></article><article class="tile"><span class="eyebrow">Workout Day</span><h2>Push Day</h2><p class="meta">5 个动作 · 建议周一</p><button class="btn btn-secondary" data-start>开始训练</button></article><article class="tile"><span class="eyebrow">动作库</span><h2>12 个动作</h2><p class="meta">用户自定义 · 无预置动作</p><button class="btn btn-secondary" data-toast="已进入动作管理">管理动作</button></article></div>`;
    }

    function progressMarkup() {
      return `<p class="eyebrow">按动作查看</p><h1>Progress</h1><p class="lede">不同动作不强行相加。选择一个动作，看清它自己的变化。</p><div class="grid"><article class="tile"><span class="eyebrow">杠铃卧推</span><div class="metric value">94%</div><p class="meta">最近一次达成率</p><svg class="line-chart" viewBox="0 0 320 120" role="img" aria-label="卧推达成率趋势"><defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="currentColor" stop-opacity=".28"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><polyline points="5,94 55,77 105,80 155,50 205,58 255,25 315,18"/></svg></article><article class="tile"><span class="eyebrow">本周时间</span><div class="metric value">186</div><p class="meta">分钟 · 4 次训练</p><div class="bars"><i style="--h:18%"></i><i style="--h:65%"></i><i style="--h:32%"></i><i style="--h:88%"></i><i style="--h:44%"></i><i style="--h:72%"></i><i style="--h:25%"></i></div></article><article class="tile"><span class="eyebrow">进阶提示</span><h2>可以更进一步</h2><p class="meta">卧推连续 3 次达标，其中 2 次超额。可考虑增加重量。</p></article></div>`;
    }

    function hydrateViews() {
      stage.querySelectorAll('[data-view="plans"]').forEach(el => el.innerHTML = plansMarkup());
      stage.querySelectorAll('[data-view="progress"]').forEach(el => el.innerHTML = progressMarkup());
    }

    function openWorkout() {
      elapsed = 37 * 60 + 12;
      paused = false;
      const layer = document.createElement('section');
      layer.className = 'workout-layer';
      layer.innerHTML = `<div class="workout-panel" role="dialog" aria-modal="true" aria-labelledby="workout-title"><div class="workout-head"><div><p class="eyebrow">力量基础 · Push Day</p><h2 id="workout-title">杠铃卧推</h2><p class="meta">3 组 × 10 次 × 60.0 kg</p></div><div><div class="timer value" aria-label="有效训练时间">37:12</div><div class="meta">有效训练时间</div></div></div><div class="paused-banner">训练已挂起 · 计时与记录已冻结</div><div class="exercise"><div class="exercise-head"><h3>工作组</h3><span class="meta"><b data-rate>33%</b> 达成</span></div><div class="set-list"><button class="set-row" data-set data-done><span>1</span><span><b>60.0 kg</b><br><span class="meta">目标重量</span></span><span><b>10 次</b><br><span class="meta">实际完成</span></span><span class="set-rate">100%</span><span class="check"><span>○</span></span></button><button class="set-row" data-set><span>2</span><span><b>60.0 kg</b><br><span class="meta">目标重量</span></span><span><b>10 次</b><br><span class="meta">点击即达标</span></span><span class="set-rate">—</span><span class="check"><span>○</span></span></button><button class="set-row" data-set><span>3</span><span><b>60.0 kg</b><br><span class="meta">目标重量</span></span><span><b>10 次</b><br><span class="meta">点击即达标</span></span><span class="set-rate">—</span><span class="check"><span>○</span></span></button></div></div><div class="exercise"><div class="exercise-head"><h3>上斜哑铃推</h3><span class="meta">3 组 · 尚未开始</span></div></div><div class="workout-footer"><div class="actions"><button class="btn btn-secondary" data-pause>挂起</button><button class="btn btn-secondary" data-abandon>放弃</button><button class="btn btn-secondary" data-lock-on-pause data-toast="已打开追加动作表单">＋ 追加动作</button></div><button class="btn btn-primary" data-lock-on-pause data-finish>结束训练</button></div></div>`;
      document.body.append(layer);
      startTimer();
    }

    function startTimer() {
      clearInterval(timerId);
      timerId = setInterval(() => {
        if (paused) return;
        elapsed += 1;
        const timer = document.querySelector('.workout-layer .timer');
        if (timer) timer.textContent = formatTime(elapsed);
      }, 1000);
    }

    function formatTime(total) {
      const mins = Math.floor(total / 60).toString().padStart(2,'0');
      const secs = (total % 60).toString().padStart(2,'0');
      return `${mins}:${secs}`;
    }

    function togglePause(button) {
      paused = !paused;
      const panel = button.closest('.workout-panel');
      panel.toggleAttribute('data-paused', paused);
      button.textContent = paused ? '继续训练' : '挂起';
      panel.querySelectorAll('[data-lock-on-pause]').forEach(control => { control.disabled = paused; });
      showToast(paused ? '训练已挂起，计时停止' : '已继续训练');
    }

    function finishWorkout() {
      const workout = document.querySelector('.workout-layer');
      const done = workout.querySelectorAll('[data-set][data-done]').length;
      workout.remove();
      clearInterval(timerId);
      const layer = document.createElement('section');
      layer.className = 'result-layer';
      layer.innerHTML = `<div class="result-panel" role="dialog" aria-modal="true" aria-labelledby="result-title"><p class="eyebrow">训练完成</p><h2 id="result-title">今天练得很稳。</h2><div class="result-ring">${Math.max(67,done*33)}%</div><p class="lede" style="margin-inline:auto">杠铃卧推按动作独立计算。未完成组已作为跳过记录，不和其他动作平均。</p><div class="result-grid"><div class="stat"><strong>${formatTime(elapsed)}</strong><span class="meta">有效训练时间</span></div><div class="stat"><strong>${done}/3</strong><span class="meta">卧推完成组</span></div><div class="stat"><strong>+1</strong><span class="meta">进阶观察</span></div></div><button class="btn btn-primary" data-close-result>查看 Progress</button></div>`;
      document.body.append(layer);
    }

    function openSettings() {
      const layer = document.createElement('section');
      layer.className = 'settings-layer';
      layer.innerHTML = `<div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title"><div class="workout-head"><div><p class="eyebrow">个人设置</p><h2 id="settings-title">林默</h2></div><button class="icon-btn" data-close-settings aria-label="关闭设置">×</button></div><div class="settings-row"><span>重量单位</span><strong>kg</strong></div><div class="settings-row"><span>时区</span><strong>Asia/Shanghai</strong></div><div class="settings-row"><span>匿名遥测</span><strong>开启</strong></div><div class="actions" style="margin-top:24px"><button class="btn btn-secondary" data-toast="JSON 导出已模拟">导出 JSON</button><button class="btn btn-danger" data-toast="原型不会真的删除账户">删除账户</button></div></div>`;
      document.body.append(layer);
    }

    function showToast(message) {
      document.querySelector('.toast')?.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.setAttribute('role','status');
      toast.textContent = message;
      document.body.append(toast);
      setTimeout(() => toast.remove(), 1900);
    }

    document.addEventListener('click', (event) => {
      const nav = event.target.closest('[data-nav]');
      if (nav) {
        const app = nav.closest('[data-app]');
        const target = nav.dataset.nav;
        app.querySelectorAll('[data-nav]').forEach(el => el.toggleAttribute('data-active', el.dataset.nav === target));
        app.querySelectorAll('[data-view]').forEach(el => el.toggleAttribute('data-visible', el.dataset.view === target));
        return;
      }
      if (event.target.closest('[data-start]')) return openWorkout();
      const set = event.target.closest('[data-set]');
      if (set) {
        set.toggleAttribute('data-done');
        const rows = [...set.closest('.set-list').querySelectorAll('[data-set]')];
        const done = rows.filter(row => row.hasAttribute('data-done')).length;
        set.closest('.workout-panel').querySelector('[data-rate]').textContent = Math.round(done / rows.length * 100) + '%';
        return;
      }
      const pause = event.target.closest('[data-pause]');
      if (pause) return togglePause(pause);
      if (event.target.closest('[data-finish]')) return finishWorkout();
      if (event.target.closest('[data-abandon]')) {
        clearInterval(timerId);
        event.target.closest('.workout-layer').remove();
        return showToast('本次训练已放弃，不计入统计');
      }
      if (event.target.closest('[data-settings]')) return openSettings();
      if (event.target.closest('[data-close-settings]')) return event.target.closest('.settings-layer').remove();
      if (event.target.closest('[data-close-result]')) {
        event.target.closest('.result-layer').remove();
        const progress = stage.querySelector('[data-nav="progress"]');
        progress?.click();
        return;
      }
      const toastTarget = event.target.closest('[data-toast]');
      if (toastTarget) showToast(toastTarget.dataset.toast);
    });

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.key === 'Escape') document.querySelector('.settings-layer, .result-layer')?.remove();
    });

    mount();
  </script>
</body>
</html>
