<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>CwFitness · 登录页原型</title>
  <style>
    :root{--text:rgba(255,255,255,.96);--muted:rgba(255,255,255,.62);--line:rgba(255,255,255,.12);--accent:#c2db86;--danger:#e9a095;--ease:cubic-bezier(.23,1,.32,1);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--text);background:#070909;font-synthesis:none}
    *{box-sizing:border-box}html,body,#stage{min-height:100%;margin:0}body{overflow:hidden;background:#070909}button,input{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid rgba(255,255,255,.82);outline-offset:3px}
    .login{position:relative;min-height:100vh;isolation:isolate;overflow:hidden;background:#090b0b}.login::before{content:"";position:absolute;inset:-2%;z-index:-3;background:var(--backdrop) center/cover no-repeat;filter:saturate(.46) brightness(.54);animation:image-arrive 900ms var(--ease) both}.login::after{content:"";position:absolute;inset:0;z-index:-2;background:var(--veil);pointer-events:none}.grain{position:absolute;inset:0;z-index:-1;opacity:.14;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E")}
    @keyframes image-arrive{from{opacity:.5;transform:scale(1.045)}to{opacity:1;transform:scale(1)}}
    .brand{position:absolute;top:30px;left:clamp(24px,4vw,60px);z-index:4;display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.025em}.mark{width:28px;height:28px;border-radius:9px;background:radial-gradient(circle at 30% 25%,#f2fad7,var(--accent) 48%,#4d6431);box-shadow:0 8px 26px rgba(180,215,115,.24)}
    .panel{background:rgba(13,15,15,.7);-webkit-backdrop-filter:blur(28px) saturate(1.16);backdrop-filter:blur(28px) saturate(1.16);box-shadow:inset 0 1px rgba(255,255,255,.14),0 30px 90px rgba(0,0,0,.38)}
    .auth{width:min(420px,calc(100vw - 40px));padding:34px;border-radius:32px;animation:panel-arrive 520ms var(--ease) 80ms both;transform-origin:center}
    @keyframes panel-arrive{from{opacity:0;transform:translateY(16px) scale(.975)}to{opacity:1;transform:none}}
    .eyebrow{margin:0 0 10px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.auth h1{margin:0;font-size:clamp(34px,4vw,48px);line-height:1;letter-spacing:-.048em}.intro{margin:13px 0 27px;color:var(--muted);font-size:14px;line-height:1.55}
    .field{display:block;margin-top:14px}.field-label{display:block;margin:0 0 8px 3px;color:rgba(255,255,255,.72);font-size:12px;font-weight:680}.input-wrap{position:relative;display:block}.input-wrap input{width:100%;height:50px;border:1px solid rgba(255,255,255,.11);border-radius:16px;padding:0 72px 0 16px;color:var(--text);background:rgba(255,255,255,.075);outline:none;transition:border-color 160ms ease-out,background-color 160ms ease-out,box-shadow 160ms ease-out}.input-wrap input:hover{background:rgba(255,255,255,.095)}.input-wrap input:focus{border-color:rgba(194,219,134,.62);box-shadow:0 0 0 4px rgba(194,219,134,.1)}.input-wrap input[aria-invalid="true"]{border-color:rgba(233,160,149,.72)}.reveal{position:absolute;right:8px;top:50%;display:flex;align-items:center;height:36px;padding:0 10px;border:0;border-radius:11px;background:transparent;color:var(--muted);cursor:pointer;transform:translateY(-50%)}.reveal:hover{background:rgba(255,255,255,.08);color:#fff}
    .error{min-height:18px;margin:7px 3px 0;color:var(--danger);font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 2px 22px}.check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.check input{accent-color:var(--accent)}a,.link{padding:0;border:0;background:none;color:rgba(255,255,255,.76);font-size:12px;text-decoration:none;cursor:pointer}.link:hover,a:hover{color:#fff}.submit{position:relative;width:100%;height:50px;border:0;border-radius:999px;color:#11150d;background:var(--accent);font-weight:800;cursor:pointer;box-shadow:0 14px 36px rgba(173,211,107,.17);transition:transform 120ms var(--ease),filter 160ms ease-out}.submit:hover{filter:brightness(1.05)}.submit:active{transform:scale(.98)}.submit[aria-busy="true"]{color:transparent}.submit[aria-busy="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border:2px solid rgba(10,15,7,.3);border-top-color:#111;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.foot{margin:22px 0 0;text-align:center;color:var(--muted);font-size:12px}.foot .link{margin-left:5px;color:var(--accent)}
    .toast{position:fixed;top:28px;left:50%;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:999px;background:rgba(18,21,19,.9);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 16px 50px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);font-size:13px;animation:toast-in 220ms var(--ease) both}@keyframes toast-in{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}.toast i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}
    .immersive{--backdrop:linear-gradient(90deg,rgba(4,6,6,.94) 0%,rgba(4,6,6,.56) 45%,rgba(4,6,6,.1)),url("https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&w=2200&q=86");--veil:linear-gradient(180deg,rgba(4,5,5,.15),rgba(4,5,5,.48))}.immersive .shell{min-height:100vh;display:flex;align-items:center;padding:90px clamp(24px,7vw,110px)}.immersive .auth{margin-top:26px}.immersive .caption{position:absolute;right:clamp(30px,6vw,88px);bottom:78px;width:min(440px,40vw);text-align:right}.caption strong{display:block;font-size:clamp(28px,3.5vw,52px);line-height:1.03;letter-spacing:-.045em}.caption span{display:block;margin-top:12px;color:var(--muted);font-size:13px}
    .spotlight{--backdrop:radial-gradient(circle at 50% 42%,rgba(9,12,11,.05),rgba(5,7,7,.7) 54%,#050707 92%),url("https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?auto=format&fit=crop&w=2200&q=86");--veil:radial-gradient(circle at center,transparent,rgba(3,5,5,.58))}.spotlight .brand{left:50%;transform:translateX(-50%)}.spotlight .shell{min-height:100vh;display:grid;place-items:center;padding:90px 20px}.spotlight .auth{text-align:center;background:rgba(12,15,14,.64)}.spotlight .field,.spotlight .error{text-align:left}.spotlight .auth h1{font-size:42px}.spotlight .intro{max-width:300px;margin-inline:auto}.spotlight .ambient{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);color:rgba(255,255,255,.42);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
    .split{--backdrop:linear-gradient(90deg,rgba(5,7,7,.14),rgba(5,7,7,.34)),url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=2200&q=86");--veil:linear-gradient(90deg,rgba(4,6,6,.12) 0%,rgba(4,6,6,.2) 38%,rgba(7,9,9,.68) 62%,rgba(7,9,9,.94) 82%,#070909 100%)}.split .shell{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(460px,.75fr)}.split .story{display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(80px,8vw,124px) clamp(30px,6vw,90px)}.split .story h2{max-width:640px;margin:0;font-size:clamp(48px,6vw,86px);line-height:.94;letter-spacing:-.058em}.split .story p{max-width:490px;margin:18px 0 0;color:var(--muted);line-height:1.55}.split .form-side{display:grid;place-items:center;padding:80px 34px;background:transparent}.split .auth{width:min(390px,100%);padding:0;background:none;box-shadow:none}.split .auth h1{font-size:42px}
    .proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}
    @media(max-width:760px){body{overflow:auto}.brand{top:22px;left:22px}.auth{padding:27px 22px;border-radius:26px}.immersive .shell{align-items:flex-end;padding:82px 20px 86px}.immersive .caption{display:none}.spotlight .shell{padding:82px 20px 90px}.spotlight .ambient{display:none}.split{--veil:linear-gradient(180deg,rgba(4,6,6,.3),rgba(7,9,9,.96) 48%)}.split .shell{display:flex;align-items:flex-end;padding:86px 20px}.split .story{display:none}.split .form-side{width:100%;padding:0;background:none;backdrop-filter:none}.split .auth{padding:26px 22px;border-radius:26px;background:rgba(12,15,14,.74);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:inset 0 1px rgba(255,255,255,.13),0 30px 80px rgba(0,0,0,.42)}.proto-picker{bottom:14px}.proto-picker-item{padding-inline:9px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
    @media(prefers-reduced-transparency:reduce){.panel,.toast,.form-side{background:#111414!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}}
    @media(prefers-contrast:more){.panel,.toast{background:rgba(5,7,7,.96);box-shadow:inset 0 0 0 2px #fff}.input-wrap input{border-color:rgba(255,255,255,.65)}}
  </style>
</head>
<body>
  <main id="stage"></main>
  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Immersive</button>
    <button class="proto-picker-item">Spotlight</button>
    <button class="proto-picker-item">Split</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>
  <template id="auth-form"><form class="auth panel" novalidate><p class="eyebrow">欢迎回来</p><h1>继续训练。</h1><p class="intro">登录以查看今天的计划，并从上次结束的地方继续。</p><label class="field"><span class="field-label">邮箱</span><span class="input-wrap"><input name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required aria-describedby="email-error"></span><span class="error" id="email-error" aria-live="polite"></span></label><label class="field"><span class="field-label">密码</span><span class="input-wrap"><input name="password" type="password" autocomplete="current-password" placeholder="至少 8 个字符" required minlength="8" aria-describedby="password-error"><button class="reveal" type="button" aria-label="显示密码">显示</button></span><span class="error" id="password-error" aria-live="polite"></span></label><div class="row"><label class="check"><input type="checkbox" name="remember">保持登录</label><button class="link" type="button" data-message="密码重置链接将发送到你的邮箱">忘记密码？</button></div><button class="submit" type="submit">登录</button><p class="foot">第一次使用 CwFitness？<button class="link" type="button" data-message="注册流程将在下一轮原型中展开">创建账户</button></p></form></template>
  <script>
    const stage=document.getElementById('stage');const auth=document.getElementById('auth-form');
    const variants=[
      ()=>`<section class="login immersive"><i class="grain"></i><div class="brand"><i class="mark"></i>CwFitness</div><div class="shell"><div data-form></div><div class="caption"><strong>把今天，<br>练得扎实。</strong><span>你的计划、记录与进步，都在这里。</span></div></div></section>`,
      ()=>`<section class="login spotlight"><i class="grain"></i><div class="brand"><i class="mark"></i>CwFitness</div><div class="shell"><div data-form></div><div class="ambient">Private by design · Built for consistency</div></div></section>`,
      ()=>`<section class="login split"><i class="grain"></i><div class="brand"><i class="mark"></i>CwFitness</div><div class="shell"><div class="story"><p class="eyebrow">下一组，由你定义</p><h2>每一次完成，<br>都有迹可循。</h2><p>围绕你的训练计划记录每一组，在恰当的时间看见真正的进步。</p></div><div class="form-side"><div data-form></div></div></div></section>`
    ];
    const picker=document.querySelector('.proto-picker');const highlight=picker.querySelector('.proto-picker-highlight');const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];const replay=picker.querySelector('.proto-picker-replay');let current=0;
    function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
    function wire(){const target=stage.querySelector('[data-form]');target.append(auth.content.cloneNode(true));const form=target.querySelector('form');const password=form.elements.password;form.querySelector('.reveal').addEventListener('click',e=>{const visible=password.type==='text';password.type=visible?'password':'text';e.currentTarget.textContent=visible?'显示':'隐藏';e.currentTarget.setAttribute('aria-label',visible?'显示密码':'隐藏密码')});form.querySelectorAll('[data-message]').forEach(el=>el.addEventListener('click',()=>showToast(el.dataset.message)));form.addEventListener('submit',e=>{e.preventDefault();const email=form.elements.email;let valid=true;const emailError=form.querySelector('#email-error');const passwordError=form.querySelector('#password-error');emailError.textContent=email.validity.valid?'':'请输入有效的邮箱地址';passwordError.textContent=password.validity.valid?'':'密码至少需要 8 个字符';email.setAttribute('aria-invalid',String(!email.validity.valid));password.setAttribute('aria-invalid',String(!password.validity.valid));valid=email.validity.valid&&password.validity.valid;if(!valid){form.querySelector('[aria-invalid="true"]').focus();return}const button=form.querySelector('.submit');button.setAttribute('aria-busy','true');button.disabled=true;setTimeout(()=>{button.removeAttribute('aria-busy');button.disabled=false;showToast('登录成功，即将进入今日训练')},650)})}
    function showToast(message){document.querySelector('.toast')?.remove();const toast=document.createElement('div');toast.className='toast';toast.setAttribute('role','status');toast.innerHTML=`<i></i><span>${message}</span>`;document.body.append(toast);setTimeout(()=>toast.remove(),2600)}
    function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();wire()})}
    function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}
    items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));replay?.addEventListener('click',()=>mount(current));window.addEventListener('resize',moveHighlight);
    document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.metaKey||e.ctrlKey||e.altKey)return;const num=parseInt(e.key,10);if(num>=1&&num<=variants.length)setActive(num-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current)});
    setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body>
</html>
